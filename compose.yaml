services:
  forecast:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - forecast-data:/srv/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 15
volumes:
  forecast-data:
