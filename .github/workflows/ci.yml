name: Verify forecasts and deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m scripts.restore_check
      - run: python -m scripts.export_openapi && git diff --exit-code docs/openapi.json
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - run: docker compose restart && docker compose up -d --wait && python scripts/smoke.py --check-persistence
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            test-results.xml
            build/smoke.json
